
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0">
    <title>شركة العاصمة للفحم | تصدير فحم نباتي نخب أول</title>
    
    <!-- SEO Meta Tags -->
    <meta name="description" content="شركة العاصمة للفحم: المصدر الأول للفحم المصري عالي الجودة. متخصصون في فحم البرتقال والليمون والمشاوي بمواصفات عالمية وتوصيل دولي.">
    <meta name="keywords" content="تصدير فحم, فحم برتقال, فحم ليمون, فحم مصري, فحم نباتي, فحم مشاوي, شركة العاصمة, Al-Asimh Charcoal">
    <meta name="author" content="Al-Asimh Charcoal Enterprise">
    <link rel="canonical" href="https://alasimh.net/">

    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --primary: #f59e0b;
            --accent: #fbbf24;
            --bg-site: #ffffff;
        }
        
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            overflow-x: hidden;
            background-color: var(--bg-site);
            scroll-behavior: smooth;
        }

        [dir="rtl"] { font-family: 'Cairo', sans-serif; }
        [dir="ltr"] { font-family: 'Inter', sans-serif; }

        .dynamic-text {
            background: linear-gradient(135deg, var(--primary) 0%, #ea580c 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        
        .dynamic-bg {
            background: linear-gradient(135deg, var(--primary) 0%, #ea580c 100%);
        }

        .reveal {
            opacity: 0;
            transform: translateY(20px);
            transition: opacity 0.6s cubic-bezier(0.16, 1, 0.3, 1), transform 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }
        
        .reveal.active {
            opacity: 1 !important;
            transform: translateY(0) !important;
        }

        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-thumb { background: var(--primary); border-radius: 10px; }
    </style>

    <script type="importmap">
    {
      "imports": {
        "@google/genai": "https://esm.sh/@google/genai@^1.40.0",
        "react-dom/": "https://esm.sh/react-dom@^19.2.4/",
        "react/": "https://esm.sh/react@^19.2.4/",
        "react": "https://esm.sh/react@^19.2.4"
      }
    }
    </script>
</head>
<body class="antialiased">
    <div id="root"></div>
    <!-- الربط الأساسي بملف التطبيق -->
    <script type="module" src="index.tsx"></script>
    
    <script>
        function initReveal() {
            const observer = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        entry.target.classList.add('active');
                    }
                });
            }, { threshold: 0.05 });

            document.querySelectorAll('.reveal').forEach(el => observer.observe(el));
        }
        window.addEventListener('load', initReveal);
        const mutationObserver = new MutationObserver(initReveal);
        mutationObserver.observe(document.body, { childList: true, subtree: true });
    </script>
</body>
</html>
